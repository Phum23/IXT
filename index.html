<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IXT | I excel in Technology</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }
        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 10%;
            background-color: #1e293b;
            border-bottom: 2px solid #38bdf8;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .logo span {
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 400;
            display: block;
            letter-spacing: 0px;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }
        /* ปุ่มบนแถบเมนูดีไซน์ล้ำสมัยแบบเดียวกันทั้งหมด */
        .nav-btn {
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            background-color: rgba(56, 189, 248, 0.1);
            cursor: pointer;
        }
        .nav-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        /* ปุ่มลิงก์หน้าแรกข้ามไฟล์ */
        .nav-btn-link {
            display: inline-block;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s ease;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            background-color: rgba(56, 189, 248, 0.1);
            cursor: pointer;
        }
        .nav-btn-link:hover {
            background-color: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 70vh;
            padding: 2rem 10%;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 600px;
            margin-bottom: 2rem;
        }
        /* Content Section (กล่องแสดงเนื้อหาจัดกึ่งกลางเด่นชัด) */
        .content-section {
            display: none;
            padding: 4rem 10%;
            background-color: #1e293b;
            min-height: 65vh;
        }
        .content-container {
            max-width: 850px;
            margin: 0 auto;
            background: #0b1329;
            padding: 3.5rem 2.5rem;
            border-radius: 16px;
            border: 2px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.15);
            display: flex;
            flex-direction: column;
            text-align: center;
            align-items: center;
        }
        .content-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .content-body {
            font-size: 1.25rem;
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 3.5rem;
            min-height: 220px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* ตกแต่งเนื้อหาย่อยภายในกล่องให้อ่านง่าย */
        .content-body strong {
            color: #38bdf8;
            font-size: 1.4rem;
            display: block;
            margin-bottom: 0.8rem;
        }
        .content-body span {
            color: #94a3b8;
            font-size: 1.1rem;
            display: block;
            margin-top: 0.5rem;
        }
        /* ปุ่มควบคุมการเปลี่ยนหน้าก่อนหน้า-ถัดไป */
        .nav-controls {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            width: 100%;
            margin-top: auto;
        }
        .page-btn {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 0.8rem 2.2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .page-btn:hover:not(:disabled) {
            border-color: #38bdf8;
            color: #fff;
            background-color: #334155;
            transform: translateY(-1px);
        }
        .page-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }
        /* ปุ่มหน้าแรกสไตล์ปุ่มปิด/ย้อนกลับสไตล์โพสต์โซเชียล */
        .home-btn {
            border-color: #f43f5e;
            color: #f43f5e;
            background-color: rgba(244, 63, 94, 0.05);
        }
        .home-btn:hover {
            border-color: #f43f5e !important;
            background-color: #f43f5e !important;
            color: #fff !important;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
        }
        /* Features Section */
        .features {
            padding: 5rem 10%;
            background-color: #0f172a;
        }
        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 3rem;
            color: #ffffff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: border-color 0.3s;
        }
        .card:hover {
            border-color: #38bdf8;
        }
        .card h3 {
            color: #38bdf8;
            margin-bottom: 1rem;
            font-size: 1.4rem;
        }
        .card p {
            color: #94a3b8;
        }
        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            background-color: #1e293b;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid #334155;
        }
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar (เอาปุ่มหน้าแรกออกตามบรีฟ เหลือปุ่มเปิดเมนูบอร์ดคอนเทนต์) -->
    <nav>
        <div class="logo">
            IXT <span>I excel in Technology</span>
        </div>
        <ul class="nav-links">
            
        </ul>
    </nav>

    <!-- Hero Section (หน้าแรกหลัก) -->
    

    <!-- Content Section (กล่องข้อความสไตล์โพสต์คอนเทนต์) -->
    <section class="content-section" id="content-section">
        <div class="content-container">
            <div class="content-title" id="content-title">Title</div>
            <div class="content-body" id="content-body">Content...</div>
            <div class="nav-controls">
                <button class="page-btn" id="prev-btn" onclick="changePage(-1)" disabled>ก่อนหน้า</button>
                
                <!-- ปุ่มหน้าแรก (ย้ายมาอยู่ตรงนี้ เพื่อทำหน้าที่เสมือนปุ่มปิด/ย้อนกลับหน้าแรกสุด) -->
                <button class="page-btn home-btn" onclick="goBackHome()">หน้าแรก</button>
                
                <button class="page-btn" id="next-btn" onclick="changePage(1)">ถัดไป</button>
            </div>
        </div>
    </section>

    <!-- Features Section -->
    <section class="features">
    <h2 class="section-title"></h2>
    <div class="grid">
        
        <!-- กล่อง Innovation ที่เปลี่ยนเป็นลิงก์ (ใส่ชื่อไฟล์ที่ต้องการในช่อง href) -->
        <a href="learning.html" class="card" style="text-decoration: none; display: block; height: 100%;">
            <h3>Learning</h3>
            <p>การเรียนรู้ Software และ Hardware</p>
        </a>

        <a href="game.html" class="card" style="text-decoration: none; display: block; height: 100%;">
            <h3>Game</h3>
            <p>ฝึกพิมพ์ภาาา Srcipt</p>
        </a>

        <div class="card">
            <h3>Scalability</h3>
            <p>ระบบที่ออกแบบมาเพื่อรองรับการเติบโตของธุรกิจของคุณในอนาคตอย่างไร้ขีดจำกัด</p>
        </div>

    </div>
</section>
